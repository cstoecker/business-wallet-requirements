name: Build, check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"   # weekly full re-check (link rot, data drift)

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml openpyxl
      - name: Validate data, requirements, concepts and figures
        run: python3 scripts/check_concepts.py
      - name: Generate downloads (Excel, CSV, JSON-LD) from the data
        run: python3 scripts/build_downloads.py
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Report concept articles by status
        run: python3 scripts/check_concepts.py --report
      - name: Check built site (SEO, JSON-LD, figures, robots, sitemap, internal links, concept coverage)
        run: python3 scripts/check_site.py _site
        env:
          BASEURL: ${{ steps.pages.outputs.base_path }}
      - name: Check links (internal on every run, external weekly and on request)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --root-dir ${{ github.workspace }}/_site '_site/**/*.html'
          fail: true
      - name: Publish IndexNow key proof
        if: github.event_name != 'pull_request'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -n "$INDEXNOW_KEY" ]; then printf '%s' "$INDEXNOW_KEY" > "_site/${INDEXNOW_KEY}.txt"; fi
      - name: Keep the built sitemap for IndexNow
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-sitemap
          path: _site/sitemap.xml
          retention-days: 1
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    if: github.event_name != 'pull_request'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-sitemap
          path: _indexnow
      - name: Notify IndexNow after deployment
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_URL: https://spherity.github.io/business-wallet-requirements
        run: node scripts/notify-indexnow.mjs --sitemap _indexnow/sitemap.xml --key-file a3fe5ee5880a644a4124489d4d1fce86.txt
