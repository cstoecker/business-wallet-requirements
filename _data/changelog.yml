# Public change log (what changed in laws, standards, ecosystems and on this site). Newest first.
# Entries are added by people or by the weekly agent through a reviewed pull request. type: law | standard | ecosystem | site
- date: "2026-10-04"
  type: site
  title: "53 requirements added for gaps in mandates, key custody and cross-jurisdiction identity"
  summary: "Owner-side status checks and revocation of mandates (clusters K02, K03), recording, evidence and disclosure for key custody (K04) and identifiers, assurance and third-country partners (K17), from the Commission proposal, the Council text, eIDAS, CIR 2015/1502 and the WE BUILD rulebooks. Eleven custody and six identity items are derivations (class D). Mandate items cite a rulebook version newer than the registered commit and are marked for source check."
  sources: [SRC-EBW-PROPOSAL, SRC-EIDAS-CONSOL, SRC-CIR-2026-1731]
- date: "2026-10-03"
  type: ecosystem
  title: "40 cross-jurisdiction requirements added from Catena-X standards"
  summary: "Identification of business partners (BPN), registration and onboarding, country rules and company certificates from CX-0006, CX-0009, CX-0010, CX-0050, CX-0076, CX-0135, CX-0149, CX-0152 and CX-0167 (Neptune preview). Several conflict with the EBW scope (single issuing organisation, BPNL only for capital companies, undefined identity proofing); they are tagged for review in cluster K17."
  sources: [SRC-CX-0010, SRC-CX-0050, SRC-CX-0006, SRC-CX-0009, SRC-CX-0076, SRC-CX-0135, SRC-CX-0149, SRC-CX-0152]
- date: "2026-10-03"
  type: site
  title: "199 draft requirements added from official sources"
  summary: "Derived from the Commission proposal COM(2025) 838, the consolidated eIDAS Regulation, the EUDI Wallet implementing regulations and the ARF high-level requirements, and horizontal law (GDPR, NIS2, DORA, CRA, AI Act, Data Act). Each requirement has a verbatim source extract, a category and a provenance class. None has been reviewed by a named person yet; the AI Act and DORA entries are derivations (class D)."
  sources: [SRC-EBW-PROPOSAL, SRC-EIDAS-CONSOL, SRC-GDPR, SRC-NIS2, SRC-DORA, SRC-CRA, SRC-AIACT, SRC-DATAACT]
- date: "2026-10-03"
  type: site
  title: "Concept article added: Trust list"
  summary: "Structure of the EU trusted list and the lists of trusted entities for wallet roles, how a relying party authenticates and uses them, with two figures. Open verification points are marked in the article."
  sources: [SRC-ETSI-119612, SRC-ETSI-119602, SRC-ARF-TRUST, SRC-EC-ID-2015-1505]
- date: "2026-10-03"
  type: site
  title: "Legal roadmap added"
  summary: "Swimlane roadmap chart and page with milestones, gates, Council presidencies and risks from the Commission proposal to mandatory acceptance. Periods relative to entry into force verified against the text of COM(2025) 838; calendar dates are scenarios."
  sources: [SRC-EC-IP-25-2718, SRC-EBW-PROPOSAL]
- date: "2026-10-03"
  type: site
  title: "Business cases added (macroeconomic, ecosystem, company)"
  summary: "Forty-one traced claims from the Commission impact assessment SWD(2025) 837, other official impact assessments and academic papers, with basis, caveats and verification state. The often quoted EUR 37.5 billion SME figure could not be traced to an official document."
  sources: [SRC-EC-SWD-2025-837, SRC-EC-IP-25-2718]
- date: "2026-10-03"
  type: site
  title: "First draft published for review"
  summary: "Methodology, ecosystem pages, 29 concept registry entries and the first concept article (Trust plane) are online as a draft."
  sources: []
