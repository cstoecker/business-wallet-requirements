# Architecture decision register. status: draft (analysis written, open for decision) | planned (question defined, analysis pending).
# clusters link to _data/graph/clusters.yml; page is the decision page when one exists.
- id: DEC-01
  title: Credential data model, semantics and formats
  question: "Which credential formats and which semantic layer should a business wallet support so that credentials are interoperable, machine-processable and, where needed, verifiable?"
  clusters: [K01]
  status: draft
  page: /architecture/decisions/dec-01/
- id: DEC-02
  title: "Employees: personal EUDI Wallet, business wallet or both"
  question: "Should employees act for their company with their personal EUDI Wallet, with users and authorisations inside the organisation's European Business Wallet, or with a combination of both?"
  clusters: [K02, K03]
  status: draft
  page: /architecture/decisions/dec-02/
- id: DEC-03
  title: Key custody and wallet architecture
  question: "Where do the keys of an organisation live (device, hosted back-end, hardware security module, remote sealing) and what does that mean for control, assurance and exit?"
  clusters: [K04]
  status: draft
  page: /architecture/decisions/dec-03/
- id: DEC-04
  title: Trust framework and discovery
  question: "Which trust lists, lists of trusted entities and ecosystem trust anchors does a relying party use, and how does it find the right one?"
  clusters: [K05]
  status: draft
  page: /architecture/decisions/dec-04/
- id: DEC-05
  title: Identity and identifiers
  question: "How is a legal person identified across Member States and ecosystems, and how do unique identifiers, directory entries and ecosystem identifiers map to each other?"
  clusters: [K06]
  status: planned
- id: DEC-06
  title: Credential lifecycle and revocation
  question: "How are validity, status and revocation handled for credentials, wallet units and authorisations, with which latency and which privacy properties?"
  clusters: [K07]
  status: draft
  page: /architecture/decisions/dec-06/
- id: DEC-07
  title: Protocols and interfaces
  question: "Which issuance, presentation, data space and delivery protocols must a business wallet implement, and how do they fit together?"
  clusters: [K08, K12]
  status: draft
  page: /architecture/decisions/dec-07/
- id: DEC-08
  title: Privacy and data protection
  question: "How are minimisation, unlinkability and the controller and processor roles designed when the wallet owner is an organisation and the users are people?"
  clusters: [K09]
  status: draft
  page: /architecture/decisions/dec-08/
- id: DEC-09
  title: Evidence, logging and audit
  question: "What is logged, by whom, with which integrity and access rules, so that actions are attributable and auditable without exposing employees unnecessarily?"
  clusters: [K10]
  status: draft
  page: /architecture/decisions/dec-09/
- id: DEC-10
  title: "AI-first: agent protocols, agent identity and mandates"
  question: "Which agent protocols (MCP, A2A and others), which form of verifiable agent identity and agent card, and which mandate model should a business wallet support so that AI agents can act for an organisation under control?"
  clusters: [K16, K03]
  status: draft
  page: /architecture/decisions/dec-10/
- id: DEC-11
  title: "Primary and secondary identifiers, assurance and partners outside the EU"
  question: "Which identifiers are primary for an EU organisation (EUID, EBWOID, EU Company Certificate), which are secondary (BPN, LEI, party GLN, domain identifiers), how are secondary identifiers issued quickly after authentication with a primary one, and how does an EBW holder interact with partners outside the EU and with partners that have no business wallet?"
  clusters: [K17, K06, K14]
  status: draft
  page: /architecture/decisions/dec-11/
- id: DEC-12
  title: "Control plane, data plane and the verifiable evidence graph"
  question: "Where are policies decided and enforced, how do credentials, evidence and data move, and should evidence be expressed as one access-controlled linked-data graph with open-world semantics that serves policy, register, product passport and AI processes?"
  clusters: [K18, K01, K10, K16]
  status: planned
- id: DEC-13
  title: "Delegation and mandates for employees, machines and AI agents"
  question: "How do employees, machines and AI agents get authority to act for an organisation with a business wallet (roles in the wallet, mandate credentials, legal powers of attorney, protocol-level delegation), and how is that authority limited, delegated onward, shared, suspended, revoked and attributed?"
  clusters: [K03, K02, K16]
  status: planned
