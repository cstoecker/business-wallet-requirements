# Graph entity type: Claim (quantified or qualitative statement from a source, used by business cases). verification: read | snippet | unverified. type: upper-bound | lower-bound | estimate | fact | finding.
- id: CL-MAC-01
  case: BC-MACRO
  statement: The Commission states that European Business Wallets "could unlock another EUR 150 billion in savings for businesses each year", assuming broad uptake ("up to").
  figure: 150
  unit: EUR bn
  basis: per year
  geography: EU-27
  scope: upper bound, gross of costs, conditional on broad uptake
  source: SRC-EC-IP-25-2718
  location: Introduction and EBW section
  verification: read
  type: upper-bound
  caveat: The FAQ words the condition as "if all companies take up"; the impact assessment uses 75% of economic operators and 100% of public bodies. The figure is not a GDP effect.
