# Concept registry (graph entity type: Concept). One article per concept in /concepts/<slug>/.
# status: planned | proposed | draft | reviewed | published. `related` is kept symmetric by scripts/check_concepts.py.
# Entries with status proposed are suggestions to accept, rename or drop.
- id: CON-CONTROL-PLANE
  slug: control-plane-policy-engine
  title: Control plane and policy engine
  group: Architecture planes
  status: planned
  requirement_categories:
  - FUN
  - DAT
  - GOV
  related:
  - CON-TRUST-PLANE
  - CON-DATA-PLANE
  - CON-AGENT-MANDATE
  - CON-AUTHORITY-ACCESS
  - CON-WALLET-CONNECTOR
  summary: Where policies are evaluated and authorisation decisions are made for people, systems and agents.
  definition: The control plane is the part of an architecture that decides who may do what under which policy, using a policy engine that evaluates identities, attestations and mandates, and that wallets and connectors enforce.
- id: CON-DATA-PLANE
  slug: data-plane
  title: Data plane
  group: Architecture planes
  status: planned
  requirement_categories:
  - FUN
  - INT
  - DAT
  related:
  - CON-CONTROL-PLANE
  - CON-TRUST-PLANE
  - CON-DSP-DCP
  - CON-EVIDENCE-GRAPH
  summary: How credentials, evidence, documents and data actually move between parties.
  definition: The data plane is the part of an architecture that carries credentials, evidence, documents and data between parties once the control plane has authorised the exchange.
- id: CON-TRUST-PLANE
  slug: trust-plane
  title: Trust plane
  group: Architecture planes
  status: draft
  requirement_categories:
  - TRU
  - GOV
  related:
  - CON-CONTROL-PLANE
  - CON-DATA-PLANE
  - CON-TRUST-LIST
  - CON-LOA
  - CON-MULTI-TRUST
  - CON-LEGAL-PERSON-ID
  - CON-REVOCATION
  - CON-PQC
  summary: 'Who and what can be trusted and why: trust anchors, trust lists, qualified services, registries and status.'
  definition: The trust plane is the part of an architecture that establishes who or what can be trusted and why, through trust anchors, trust lists, qualified trust services, registries and revocation status.
- id: CON-KNOWLEDGE-GRAPH
  slug: knowledge-graph
  title: Knowledge graph
  group: Knowledge and evidence
  status: planned
  requirement_categories:
  - INT
  - GOV
  related:
  - CON-EVIDENCE-GRAPH
  summary: How this site links law, obligations, requirements, building blocks, standards, checks and scenarios as a machine-readable graph.
  definition: A knowledge graph represents entities and their typed relations in a machine-readable form; here it links legal sources, obligations, requirements, building blocks, standard clauses, conformance checks and scenarios.
- id: CON-EVIDENCE-GRAPH
  slug: evidence-graph
  title: Access-controlled verifiable evidence graph
  group: Knowledge and evidence
  status: planned
  requirement_categories:
  - INT
  - DAT
  - TRU
  related:
  - CON-KNOWLEDGE-GRAPH
  - CON-DATA-PLANE
  - CON-CROSS-SECTOR
  - CON-PRIVACY
  summary: Verifiable evidence expressed as linked data under open-world semantics, disclosed only to parties entitled to see it.
  definition: An evidence graph is a set of verifiable claims about entities and their relations, expressed as linked data under open-world semantics, where access to each part is controlled and each claim can be verified.
- id: CON-DSP-DCP
  slug: dsp-dcp-integration
  title: DSP and DCP integration
  group: Data spaces
  status: planned
  requirement_categories:
  - DAT
  - INT
  related:
  - CON-WALLET-CONNECTOR
  - CON-DATA-PLANE
  - CON-CROSS-SECTOR
  summary: How the Dataspace Protocol and the Decentralized Claims Protocol fit with wallets and credentials.
  definition: The Dataspace Protocol (DSP) governs catalogue, contract negotiation and transfer between data-space participants, and the Decentralized Claims Protocol (DCP) governs how participants present and verify credentials in those exchanges.
- id: CON-WALLET-CONNECTOR
  slug: wallet-connector-binding
  title: Wallet and data-space connector binding
  group: Data spaces
  status: planned
  requirement_categories:
  - DAT
  - FUN
  - TRU
  related:
  - CON-DSP-DCP
  - CON-CONTROL-PLANE
  - CON-TRUST-LIST
  summary: How an organisation's wallet is bound to the data-space connector that acts on its behalf.
  definition: Wallet and connector binding is the relationship that lets a data-space connector use credentials held for an organisation, and lets counterparties verify that the connector acts for that organisation.
- id: CON-B2G-REPORTING
  slug: b2g-reporting
  title: B2G reporting
  group: Business and government
  status: planned
  requirement_categories:
  - LEG
  - FUN
  related:
  - CON-B2G-REGISTRY
  - CON-AUTHORITY-ACCESS
  - CON-EBW-EUDIW
  - CON-QUALIFIED-SERVICES
  summary: Mandate-bound, sealed and time-stamped reports from businesses to authorities, with receipts.
  definition: B2G reporting is the submission of structured, signed or sealed and time-stamped reports by an organisation to a public body, with proof of delivery and a legally relevant acknowledgement.
- id: CON-B2G-REGISTRY
  slug: b2g-registry-obligations
  title: B2G registry obligations
  group: Business and government
  status: planned
  requirement_categories:
  - LEG
  - FUN
  related:
  - CON-B2G-REPORTING
  - CON-EBW-DPP
  - CON-AUTHORITY-ACCESS
  - CON-AUTHENTIC-SOURCES
  summary: Entries that organisations must create and maintain in public registries, linked to the legal person.
  definition: A registry obligation requires an organisation to create and maintain an entry in a public register, such as a product, device or system register, linked to the identity of the responsible legal person.
- id: CON-AUTHORITY-ACCESS
  slug: authority-access
  title: Authority access
  group: Business and government
  status: planned
  requirement_categories:
  - LEG
  - DAT
  - TRU
  related:
  - CON-B2G-REPORTING
  - CON-CONTROL-PLANE
  - CON-EBW-DPP
  - CON-B2G-REGISTRY
  summary: How authorities authenticate to and obtain lawful access to data held by organisations.
  definition: Authority access is the controlled, lawful access of public bodies, such as market-surveillance and customs authorities, to data and evidence held by organisations, including how those authorities are identified and authorised.
- id: CON-TRUSTED-AI
  slug: trusted-ai
  title: Trusted AI
  group: Trusted AI
  status: planned
  requirement_categories:
  - LEG
  - TRU
  - GOV
  related:
  - CON-AGENT-MANDATE
  - CON-AISP
  - CON-AI-SAFETY
  summary: Verifiable identity, authority and accountability for AI systems that act for organisations.
  definition: Trusted AI in this context means AI systems whose identity, authority and actions can be verified and attributed to a legal person.
- id: CON-AGENT-MANDATE
  slug: agent-mandate
  title: Agent mandate
  group: Trusted AI
  status: planned
  requirement_categories:
  - FUN
  - GOV
  - TRU
  related:
  - CON-TRUSTED-AI
  - CON-CONTROL-PLANE
  - CON-MANDATE
  - CON-AI-SAFETY
  - CON-REVOCATION
  summary: A verifiable, scoped and revocable authorisation that lets an AI agent act for an organisation.
  definition: An agent mandate is a verifiable, scoped and revocable authorisation by which an organisation lets an AI agent act on its behalf.
- id: CON-AISP
  slug: aisp
  title: AISP
  group: Trusted AI
  status: planned
  requirement_categories:
  - TRU
  - DOM
  related:
  - CON-TRUSTED-AI
  - CON-AI-SAFETY
  summary: AISP as used in the Trusted AI work from a supply-chain perspective (expansion and scope to be confirmed from the source).
  definition: To be defined from the cited source; the acronym is not expanded here until it has been confirmed.
- id: CON-AI-SAFETY
  slug: ai-safety
  title: AI safety
  group: Trusted AI
  status: planned
  requirement_categories:
  - NFR
  - LEG
  - GOV
  related:
  - CON-TRUSTED-AI
  - CON-AISP
  - CON-AGENT-MANDATE
  summary: Safety assurance for AI systems that act across organisations, and what evidence a wallet-based architecture can provide.
  definition: To be defined from official sources (for example the EU AI Act and referenced standards) and limited to what a wallet and trust architecture can evidence.
- id: CON-MULTI-TRUST
  slug: multi-trust-domains
  title: Multi-trust domains
  group: Trust
  status: planned
  requirement_categories:
  - TRU
  - GOV
  - INT
  related:
  - CON-TRUST-PLANE
  - CON-TRUST-LIST
  - CON-CROSS-SECTOR
  - CON-TRUST-LIST-DISCOVERY
  summary: How credentials and trust decisions work across ecosystems that have different trust anchors.
  definition: A trust domain is a set of participants that accept the same trust anchors and rules; multi-trust-domain architectures let credentials and decisions cross between such domains.
- id: CON-CROSS-SECTOR
  slug: cross-sector-credential-use
  title: Cross-sector credential use
  group: Trust
  status: planned
  requirement_categories:
  - INT
  - TRU
  - DOM
  related:
  - CON-MULTI-TRUST
  - CON-EVIDENCE-GRAPH
  - CON-DSP-DCP
  - CON-EBW-DPP
  summary: Using one organisation credential in several sectors and data spaces without re-onboarding.
  definition: Cross-sector credential use is the reuse of the same organisation credentials across sectors and data spaces, with sector-specific attestations added where needed.
- id: CON-TRUST-LIST
  slug: trust-list
  title: Trust list
  group: Trust
  status: planned
  requirement_categories:
  - TRU
  - GOV
  related:
  - CON-TRUST-LIST-DISCOVERY
  - CON-TRUST-PLANE
  - CON-LOA
  - CON-WALLET-CONNECTOR
  - CON-MULTI-TRUST
  - CON-QUALIFIED-SERVICES
  - CON-WUA
  summary: A governed list of trusted issuers or services that relying parties use to validate credentials.
  definition: A trust list is a governed, signed list of entities or services, such as qualified trust service providers or attestation issuers, that relying parties use as trust anchors.
- id: CON-TRUST-LIST-DISCOVERY
  slug: trust-list-discovery
  title: Trust list discovery
  group: Trust
  status: planned
  requirement_categories:
  - TRU
  - INT
  related:
  - CON-TRUST-LIST
  - CON-MULTI-TRUST
  summary: How a relying party finds the right trust list for a credential, sector or jurisdiction.
  definition: Trust list discovery is the mechanism by which a relying party finds, retrieves and authenticates the trust list that applies to a given credential type, sector or jurisdiction.
- id: CON-LOA
  slug: levels-of-assurance
  title: Levels of assurance
  group: Trust
  status: planned
  requirement_categories:
  - TRU
  - LEG
  related:
  - CON-TRUST-PLANE
  - CON-EBW-EUDIW
  - CON-TRUST-LIST
  - CON-LEGAL-PERSON-ID
  summary: The confidence a relying party can place in an identity or credential, and how levels map between regimes.
  definition: A level of assurance expresses the degree of confidence in an asserted identity or credential, as defined in the applicable regulation and standards.
- id: CON-EBW-EUDIW
