  summary: How the European Business Wallet and the EUDI Wallet of a natural person interact, including representatives and consumers.
  definition: The EBW and EUDI Wallet interaction covers how a natural person, as consumer or as authorised representative, and an organisation exchange and verify credentials between their respective wallets.
- id: CON-EBW-DPP
